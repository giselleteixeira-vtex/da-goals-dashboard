
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Goals Dashboard · D&A 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3ef;--surface:#ffffff;--border:#e2e0d8;--border-soft:#ece9e0;
  --text:#1c1b18;--text2:#6b6860;--text3:#a8a49c;
  --green:#3b6d11;--green-bg:#edf5e6;
  --yellow:#9a6500;--yellow-bg:#fdf3dc;
  --red:#a32d2d;--red-bg:#fceaea;
  --done:#0f6e56;--done-bg:#e4f5ef;
  --gray:#6b6860;--gray-bg:#f0ede6;
  --purple:#5046a8;--purple-bg:#eeedf8;--purple-bd:#c4c0f0;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.hdr h1{font-size:14px;font-weight:600;letter-spacing:-0.2px}
.hdr-sub{font-size:11px;color:var(--text3);margin-top:1px;font-family:'DM Mono',monospace}
.hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wlbl{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:5px}
.wlbl select{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-family:'DM Mono',monospace;color:var(--text)}
.hbtn{font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text2);transition:all .15s;font-family:'DM Sans',sans-serif}
.hbtn:hover{background:var(--bg);color:var(--text)}
.hbtn.primary{background:var(--text);color:var(--surface);border-color:var(--text)}
.hbtn.primary:hover{opacity:.85}
.smsg{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace}
.smsg.ok{color:var(--green)}.smsg.err{color:var(--red)}

/* LAYOUT */
.body{display:flex;flex:1;overflow:hidden}
.sidebar{width:185px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:12px 0;overflow-y:auto}
.sg{font-size:9px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;padding:8px 14px 3px}
.ni{display:block;width:100%;text-align:left;padding:7px 14px;font-size:12px;background:none;border:none;cursor:pointer;color:var(--text2);border-left:2px solid transparent;transition:all .1s;font-family:'DM Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni:hover{background:var(--bg);color:var(--text)}
.ni.on{background:var(--bg);color:var(--text);font-weight:500;border-left-color:var(--text)}
.ni.marcela{color:var(--purple)}
.ni.marcela.on{border-left-color:var(--purple);background:var(--purple-bg);color:#2e2880}
.nb{float:right;font-size:9px;padding:1px 5px;border-radius:8px;background:var(--bg);color:var(--text3);margin-left:4px;font-family:'DM Mono',monospace}
.nb.r{background:var(--red-bg);color:var(--red)}.nb.y{background:var(--yellow-bg);color:var(--yellow)}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:20px 24px}

/* WELCOME */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;text-align:center}
.welcome h2{font-size:16px;font-weight:500}
.welcome p{font-size:12px;color:var(--text2);line-height:1.7;max-width:300px}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pbtn{padding:9px 20px;background:var(--text);color:var(--surface);border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.pbtn:hover{opacity:.85}.pbtn:disabled{opacity:.4;cursor:default}
.mpbtn{padding:9px 20px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .15s}
.mpbtn:hover{opacity:.85}.mpbtn:disabled{opacity:.4;cursor:default}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px}
.stat-l{font-size:10px;color:var(--text3);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.stat-n{font-size:24px;font-weight:500;font-family:'DM Mono',monospace}
.cg{color:var(--green)}.cy{color:var(--yellow)}.cr{color:var(--red)}

/* SECTION TITLE */
.sect{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.sect:first-child{margin-top:0}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* MISSING STRIP */
.mstrip{background:var(--surface);border:1px solid #f0cccc;border-radius:7px;padding:8px 12px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mown{font-size:11px;font-weight:500;color:var(--red);flex-shrink:0}
.mgoal{font-size:10px;color:#c06060;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'DM Mono',monospace}

/* OWNER GROUP */
.og{margin-bottom:20px}
.ohdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border-soft)}
.oav{width:27px;height:27px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text2);flex-shrink:0;border:1px solid var(--border)}
.oname{font-size:12px;font-weight:600;color:var(--text)}
.oteam{font-size:10px;color:var(--text3);margin-left:3px}
.ostats{margin-left:auto;display:flex;gap:5px}

/* GOAL CARD */
.gc{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:6px}
.gc.risk{border-left:3px solid #ef9f27}.gc.blocked{border-left:3px solid var(--red)}.gc.abandoned{border-left:3px solid var(--border)}
.gc.missing{border-left:3px solid var(--red);background:#fffafa}
.gc.notstarted{border-left:3px solid var(--purple-bd);background:#fdfcff}
.gc.neverupd{border-left:3px solid var(--border-soft);background:var(--bg)}
.gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px}
.gname{font-size:12px;font-weight:500;line-height:1.4;flex:1;color:var(--text)}
.gpri{font-size:10px;color:var(--text3);font-weight:400}
.gacts{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}

/* LAST UPDATE */
.lu{background:var(--bg);border-radius:6px;padding:7px 10px;margin-top:6px}
.lu-meta{font-size:10px;color:var(--text3);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.lu-wk{font-weight:600;color:var(--text2);font-family:'DM Mono',monospace}
.lu-txt{font-size:11px;color:var(--text2);line-height:1.55}
.no-upd{border-radius:6px;padding:7px 10px;margin-top:6px;font-size:11px;font-style:italic}
.no-upd.m{background:#fff8f8;border:1px solid #f0cccc;color:var(--red)}
.no-upd.ns{background:var(--purple-bg);border:1px solid var(--purple-bd);color:var(--purple)}
.no-upd.nu{background:var(--bg);border:1px solid var(--border);color:var(--text3)}

/* WEEK DOTS */
.wdots{display:flex;gap:3px;margin-top:8px;align-items:center}
.wd{width:17px;height:4px;border-radius:2px}
.wg{background:#b8d98a}.wy{background:#f5c55a}.wr{background:#eda0a0}
.wdo{background:#85d4b8}.wab{background:#ccc9c0}.we{background:var(--border)}
.wlb{font-size:9px;color:var(--text3);margin-left:4px;font-family:'DM Mono',monospace}

/* BADGES */
.bdg{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;white-space:nowrap;font-family:'DM Mono',monospace}
.bg{background:var(--green-bg);color:var(--green)}.by{background:var(--yellow-bg);color:var(--yellow)}
.br{background:var(--red-bg);color:var(--red)}.bd{background:var(--done-bg);color:var(--done)}
.ba{background:var(--gray-bg);color:var(--gray)}.bn{background:var(--bg);color:var(--text3)}

/* CARD BUTTONS */
.cbtn{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--text2);white-space:nowrap;transition:all .1s;font-family:'DM Sans',sans-serif}
.cbtn:hover{background:var(--bg);color:var(--text)}
.cbtn:disabled{opacity:.4;cursor:default}
.cbtn.deep{border-color:var(--purple-bd);color:var(--purple)}
.cbtn.deep:hover{background:var(--purple-bg)}

/* EXPAND BOXES */
.exbox{border-radius:7px;padding:10px 12px;margin-top:8px;font-size:11px;line-height:1.65}
.exbox.plain{background:var(--bg);color:var(--text2)}
.exbox.deep{background:var(--purple-bg);border:1px solid var(--purple-bd);color:#2a256a}
.exlbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;color:var(--text3)}
.exbox.deep .exlbl{color:var(--purple)}
.exbox h3{font-size:11px;font-weight:600;margin:8px 0 3px}
.exbox h3:first-child{margin-top:0}
.exbox p{margin-bottom:3px}
.exbox li{margin:2px 0 2px 12px}

/* TOOL SECTIONS */
.toolbox{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px}
.tool-intro{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.65}
.tool-result{margin-top:16px;border-top:1px solid var(--border-soft);padding-top:14px}
.tool-result h3{font-size:12px;font-weight:600;margin:12px 0 4px}
.tool-result h3:first-child{margin-top:0}
.tool-result p{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:3px}
.tool-result li{font-size:12px;color:var(--text2);line-height:1.6;margin:2px 0 2px 14px}
.iload{font-size:11px;color:var(--text3);font-style:italic;padding:8px 0}

/* MARCELA BOX */
.mbox{background:linear-gradient(135deg,var(--purple-bg) 0%,var(--bg) 100%);border:1px solid var(--purple-bd);border-radius:9px;padding:14px 16px;margin-bottom:16px}
.mtitle{font-size:13px;font-weight:600;color:#2e2880;margin-bottom:3px}
.msub{font-size:11px;color:var(--purple);line-height:1.55}
.mtags{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
.mtag{font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(80,70,168,.12);color:var(--purple);font-weight:600;letter-spacing:.03em}

/* TEAM SECTION */
.tsec{margin-bottom:22px}
.tlbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-soft)}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Goals Dashboard · D&amp;A 2026</h1>
    <div class="hdr-sub" id="cyc">Carregue a planilha para começar</div>
  </div>
  <div class="hdr-r">
    <div class="wlbl">
      Semana
      <select id="wsel" onchange="setW(this.value)">
        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
      </select>
    </div>
    <span class="smsg" id="smsg"></span>
    <button class="hbtn primary" onclick="syncSheets()">↻ Sincronizar Sheets</button>
    <button class="hbtn" onclick="loadFile()">↑ Carregar CSV</button>
  </div>
</div>

<div class="body">
  <nav class="sidebar">
    <div class="sg">Views</div>
    <button class="ni on" onclick="show('ov')">Overview <span class="nb r" id="b-ov"></span></button>
    <button class="ni" onclick="show('ms')">Sem update <span class="nb r" id="b-ms"></span></button>
    <button class="ni" onclick="show('rk')">At Risk <span class="nb y" id="b-rk"></span></button>
    <button class="ni" onclick="show('al')">Todos <span class="nb" id="b-al"></span></button>
    <div class="sg" style="margin-top:8px">AI Tools</div>
    <button class="ni" onclick="show('an')">AI Analysis ✦</button>
    <button class="ni marcela" onclick="show('mc')">Marcela Mode ✦</button>
  </nav>

  <div class="main">
    <div id="t-ov">
      <div class="welcome">
        <div style="font-size:28px">📊</div>
        <h2>Goals Dashboard · D&amp;A</h2>
        <p>Clique em <strong>Sincronizar Sheets</strong> para carregar os dados direto da planilha, ou exporte como CSV no Google Sheets e clique em <strong>Carregar CSV</strong>.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <button class="pbtn" onclick="syncSheets()">↻ Sincronizar Sheets</button>
          <button class="hbtn" onclick="loadFile()">↑ Carregar CSV</button>
        </div>
      </div>
    </div>
    <div id="t-ms" style="display:none"></div>
    <div id="t-rk" style="display:none"></div>
    <div id="t-al" style="display:none"></div>
    <div id="t-an" style="display:none"></div>
    <div id="t-mc" style="display:none"></div>
  </div>
</div>

<script>
var APPS_URL = 'https://script.google.com/a/macros/vtex.com/s/AKfycbxAdllQg8yrQKQns9W4eG654yY9pi4hDzF2xaPvPzwGTTrvM7u7H6N-WT21mSLMnD-0/exec?token=vtex-goals-2026';
var D=[],CW=5;
var FILL=['','-','arthur to update','leandro to update','oncall','on call','to be defined','to update'];
var CACHE={};

// ── LOADERS ────────────────────────────────────────────────────────────
async function syncSheets(){
  var btn=event.target; btn.disabled=true; btn.textContent='↻ Carregando...';
  setSm('',''); prep();
  try{
    var r=await fetch(APPS_URL,{redirect:'follow'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var csv=await r.text();
    if(csv.trim().startsWith('Unauthorized')) throw new Error('Acesso negado — verifique o token');
    finish(csv,'Google Sheets');
  }catch(e){
    setSm('Erro: '+e.message,'err');
    document.getElementById('t-ov').innerHTML='<div class="welcome"><div style="color:var(--red);font-size:12px;max-width:320px;text-align:center">Não foi possível conectar ao Sheets.<br><small>'+e.message+'</small><br><br>Tente <strong>Carregar CSV</strong> como alternativa.</div></div>';
  }
  btn.disabled=false; btn.textContent='↻ Sincronizar Sheets';
}

function loadFile(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    setSm('',''); prep();
    if(f.name.endsWith('.xlsx')){
      var fr=new FileReader();
      fr.onload=function(ev){
        getXL(function(XL){
          try{
            var wb=XL.read(ev.target.result,{type:'array'});
            var sn=wb.SheetNames[0];
            for(var i=0;i<wb.SheetNames.length;i++){if(wb.SheetNames[i].replace(/\s/g,'').toUpperCase().indexOf('Q2C1')>=0){sn=wb.SheetNames[i];break;}}
            finish(XL.utils.sheet_to_csv(wb.Sheets[sn]),f.name);
          }catch(er){showErr(er.message);}
        });
      };
      fr.readAsArrayBuffer(f);
    }else{
      var fr2=new FileReader();
      fr2.onload=function(ev){try{finish(ev.target.result,f.name);}catch(er){showErr(er.message);}};
      fr2.readAsText(f);
    }
  };
  inp.click();
}

function getXL(cb){
  if(window.XLSX){cb(window.XLSX);return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=function(){cb(window.XLSX);};
  document.head.appendChild(s);
}

function prep(){
  resetTabs();
  var ov=document.getElementById('t-ov');
  ov.style.display='block';
  ov.innerHTML='<div class="welcome"><div class="spinner"></div><div style="font-size:12px;color:var(--text3)">Carregando...</div></div>';
  ov.dataset.r='1';
}

function finish(csv,src){
  parseCSV(csv);
  var t=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setSm('Atualizado às '+t,'ok');
  document.getElementById('cyc').textContent='Q2-C1 · Semana '+CW+' de 6';
  updBadges(); resetTabs(); show('ov');
}

function showErr(m){
  setSm('Erro','err');
  document.getElementById('t-ov').innerHTML='<div class="welcome"><div style="color:var(--red);font-size:12px">Erro: '+m+'</div></div>';
}

function setSm(t,c){var el=document.getElementById('smsg');el.textContent=t;el.className='smsg'+(c?' '+c:'');}

// ── CSV PARSER ─────────────────────────────────────────────────────────
function pRow(l){
  var c=[],cur='',q=false;
  for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"'){q=!q;continue;}if(ch===','&&!q){c.push(cur.trim());cur='';continue;}cur+=ch;}
  c.push(cur.trim());return c;
}

function parseCSV(csv){
  var lines=csv.split('\n').filter(function(l){return l.trim();});
  var hdr=pRow(lines[0]).map(function(h){return h.toLowerCase().trim();});
  function ci(n){return hdr.findIndex(function(h){return h.includes(n);});}
  function ciExact(n){return hdr.findIndex(function(h){return h===n;});}
  var iO=ci('owner'),iT=ci('team');
  var iG=ciExact('six weeks goal')>=0?ciExact('six weeks goal'):hdr.findIndex(function(h){return h.includes('goal')&&!h.includes('quarter')&&!h.includes('output')&&!h.includes('priority')&&!h.includes('type')&&!h.includes('product')&&!h.includes('investment');});
  var iOut=ci('output'),iP=ci('priority'),iC=ci('current');
  var wc=[1,2,3,4,5,6].map(function(w){return{
    s:hdr.findIndex(function(h){return h==='w'+w+' status'||h==='w'+w+'status'||(h.includes('week '+w)&&h.includes('status'));}),
    u:hdr.findIndex(function(h){return h==='w'+w+' update'||h==='w'+w+'update'||(h.includes('week '+w)&&h.includes('update'));})
  };});
  D=[];
  for(var r=1;r<lines.length;r++){
    var row=pRow(lines[r]);if(!row[iG]||!row[iO])continue;
    var g={owner:row[iO]||'',team:row[iT]||'',goal:row[iG]||'',output:iOut>=0?(row[iOut]||''):'',priority:iP>=0?(row[iP]||''):'',current:iC>=0?(row[iC]||''):''};
    for(var w=1;w<=6;w++){var c=wc[w-1];g['w'+w]={s:c.s>=0?(row[c.s]||'').trim():'',u:c.u>=0?(row[c.u]||'').trim():''};}
    D.push(g);
  }
  CW=parseInt(document.getElementById('wsel').value)||5;
}

// ── DATA HELPERS ───────────────────────────────────────────────────────
var SC={
  'Green':{b:'bg',d:'wg',l:'On track'},
  'Yellow':{b:'by',d:'wy',l:'At risk'},
  'Red':{b:'br',d:'wr',l:'Blocked'},
  'Done':{b:'bd',d:'wdo',l:'Done'},
  'Abandoned':{b:'ba',d:'wab',l:'Abandoned'},
  'Not started':{b:'bn',d:'we',l:'Not started'},
  '':{b:'bn',d:'we',l:'Sem update'}
};

function gW(g,n){return g['w'+n]||{s:'',u:''};}
function hasUpd(g){for(var w=1;w<=6;w++){var u=gW(g,w).u;if(u&&FILL.indexOf(u.toLowerCase())<0)return true;}return false;}
function hasSt(g){for(var w=1;w<=6;w++){if(gW(g,w).s)return true;}return false;}

function gstate(g){
  var cw=gW(g,CW),ok=cw.u&&FILL.indexOf(cw.u.toLowerCase())<0;
  if(ok)return 'ok';
  var active=(g.current&&g.current!==''&&g.current!=='Not started')||hasUpd(g)||hasSt(g);
  if(active)return 'missing';
  if(g.current==='Not started')return 'notstarted';
  return 'neverupd';
}

function isMiss(g){var s=gstate(g);return s==='missing'||s==='notstarted'||s==='neverupd';}
function isRisk(g){return['Yellow','Red','Abandoned'].indexOf(g.current)>=0;}
function getMiss(){return D.filter(isMiss);}
function getRisk(){return D.filter(isRisk);}
function getGood(){return D.filter(function(g){return['Green','Done'].indexOf(g.current)>=0;});}

function lastUpd(g){
  for(var n=CW;n>=1;n--){var w=gW(g,n);if(w.u&&FILL.indexOf(w.u.toLowerCase())<0)return{week:n,text:w.u,status:w.s||g.current};}
  return null;
}

function bdg(s){var c=SC[s]||SC[''];return '<span class="bdg '+c.b+'">'+c.l+'</span>';}

function wdots(g){
  var h='<div class="wdots">';
  for(var i=1;i<=6;i++){
    var s=gW(g,i).s,c=(SC[s]||SC['']).d,ol=i===CW?' style="outline:1.5px solid var(--text3);outline-offset:1px"':'';
    h+='<div class="wd '+c+'"'+ol+' title="S'+i+': '+(s||'?')+'"></div>';
  }
  return h+'<span class="wlb">S1–S6</span></div>';
}

function inits(n){var p=n.trim().split(' ');return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase();}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ').slice(0,300);}

// ── GOAL CARD ──────────────────────────────────────────────────────────
function goalCard(g){
  var st=gstate(g),lu=lastUpd(g);
  var cls=st==='missing'?'missing':st==='notstarted'?'notstarted':st==='neverupd'?'neverupd':isRisk(g)?(g.current==='Abandoned'?'abandoned':g.current==='Red'?'blocked':'risk'):'';
  var key=btoa(encodeURIComponent((g.owner+g.goal).slice(0,50))).replace(/[^a-zA-Z0-9]/g,'').slice(0,24);
  var allU=[1,2,3,4,5,6].map(function(n){return gW(g,n).u;}).filter(function(u){return u&&FILL.indexOf(u.toLowerCase())<0;}).join(' | ');
  var luH='';
  if(lu){
    var txt=lu.text.length>280?lu.text.slice(0,280)+'...':lu.text;
    luH='<div class="lu"><div class="lu-meta"><span class="lu-wk">S'+lu.week+'</span>'+bdg(lu.status)+'</div><div class="lu-txt">'+txt+'</div></div>';
  }else if(st==='notstarted'){
    luH='<div class="no-upd ns">Marcado como Not started — sem updates ainda</div>';
  }else if(st==='neverupd'){
    luH='<div class="no-upd nu">Sem nenhum update ou status registrado</div>';
  }else{
    luH='<div class="no-upd m">Sem update na semana '+CW+'</div>';
  }
  var warn=(st==='missing'&&lu&&lu.week<CW)?'<span style="font-size:10px;color:var(--red);margin-left:4px">⚠ sem S'+CW+'</span>':'';

  return '<div class="gc '+cls+'" id="c-'+key+'">'+
    '<div class="gtop">'+
      '<div class="gname">'+g.goal+(g.priority?' <span class="gpri">· '+g.priority+'</span>':'')+'</div>'+
      '<div class="gacts">'+
        '<div style="display:flex;align-items:center;gap:4px">'+bdg(g.current)+warn+'</div>'+
        '<button class="cbtn" onclick="doTrans(\''+key+'\',\''+esc(g.owner)+'\',\''+esc(g.goal)+'\',\''+esc(lu?lu.text:'')+'\',\''+g.current+'\')">Traduzir</button>'+
        '<button class="cbtn deep" onclick="doDive(\''+key+'\',\''+esc(g.owner)+'\',\''+esc(g.goal)+'\',\''+esc(g.output)+'\',\''+esc(allU)+'\',\''+g.current+'\')">Deep dive ↗</button>'+
      '</div>'+
    '</div>'+
    luH+
    '<div id="ex-'+key+'"></div>'+
    wdots(g)+
  '</div>';
}

// ── OWNER GROUPS ───────────────────────────────────────────────────────
function ownerGroups(goals){
  var owners=[],seen={};
  goals.forEach(function(g){if(!seen[g.owner]){owners.push(g.owner);seen[g.owner]=true;}});
  return owners.map(function(o){
    var gs=goals.filter(function(g){return g.owner===o;});
    return{owner:o,team:gs[0].team,goals:gs};
  });
}

function ownerBlock(grp){
  var ms=grp.goals.filter(isMiss).length,rk=grp.goals.filter(isRisk).length;
  var stats='';
  if(ms>0)stats+='<span class="bdg br" style="font-size:10px">'+ms+' sem update</span> ';
  if(rk>0)stats+='<span class="bdg by" style="font-size:10px">'+rk+' at risk</span>';
  var h='<div class="og">'+
    '<div class="ohdr">'+
      '<div class="oav">'+inits(grp.owner)+'</div>'+
      '<div><span class="oname">'+grp.owner+'</span><span class="oteam">· '+grp.team+'</span></div>'+
      '<div class="ostats">'+stats+'</div>'+
    '</div>';
  grp.goals.forEach(function(g){h+=goalCard(g);});
  return h+'</div>';
}

// ── AI CALLS ───────────────────────────────────────────────────────────
async function ai(prompt,ck){
  if(CACHE[ck])return CACHE[ck];
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
  });
  var d=await r.json();
  var t=d.content?.map(function(c){return c.text||'';}).join('')||'Sem resposta';
  CACHE[ck]=t;return t;
}

async function doTrans(key,owner,goal,last,status){
  var box=document.getElementById('ex-'+key);
  var btns=document.querySelectorAll('#c-'+key+' .cbtn');
  if(box.dataset.m==='t'){box.dataset.m='';box.innerHTML='';return;}
  btns.forEach(function(b){b.disabled=true;});
  box.innerHTML='<div class="iload">Traduzindo...</div>';
  try{
    var t=await ai('Traduza este goal técnico para linguagem simples para um stakeholder não-técnico. Máximo 3-4 frases. Sem jargão.\n\nGoal: '+goal+'\nOwner: '+owner+'\nÚltimo update: '+(last||'Sem updates')+'\nStatus: '+status+'\n\nExplique: (1) o que estão tentando fazer, (2) onde está agora, (3) algo a observar.','t-'+key);
    box.dataset.m='t';
    box.innerHTML='<div class="exbox plain"><div class="exlbl">Linguagem simples</div>'+t+'</div>';
  }catch(e){box.innerHTML='<div class="exbox plain" style="color:var(--red)">Erro: '+e.message+'</div>';}
  btns.forEach(function(b){b.disabled=false;});
}

async function doDive(key,owner,goal,output,allU,status){
  var box=document.getElementById('ex-'+key);
  var btns=document.querySelectorAll('#c-'+key+' .cbtn');
  if(box.dataset.m==='d'){box.dataset.m='';box.innerHTML='';return;}
  btns.forEach(function(b){b.disabled=true;});
  box.innerHTML='<div class="iload">Fazendo deep dive...</div>';
  try{
    var t=await ai('Você está ajudando uma PM a entender um goal técnico do time de dados. Explique:\n\n1. **O que esse goal significa** — explique cada componente técnico (ex: "Iceberg", "DAG", "EKS", "Lakehouse") em linguagem simples.\n2. **Como as peças se conectam** — como os componentes se relacionam nesse contexto.\n3. **Por que importa para o negócio** — impacto real se feito (ou não).\n4. **O que pode dar errado** — riscos que a PM deveria monitorar.\n\nGoal: '+goal+'\nOutput: '+(output||'não especificado')+'\nOwner: '+owner+'\nStatus: '+status+'\nUpdates: '+(allU||'nenhum')+'\n\nUse linguagem clara. Explique termos técnicos entre parênteses.','d-'+key);
    box.dataset.m='d';
    box.innerHTML='<div class="exbox deep"><div class="exlbl">Deep dive</div>'+md(t)+'</div>';
  }catch(e){box.innerHTML='<div class="exbox deep" style="color:var(--red)">Erro: '+e.message+'</div>';}
  btns.forEach(function(b){b.disabled=false;});
}

async function doAnalysis(){
  var btn=document.getElementById('abtn'),res=document.getElementById('ares');
  btn.disabled=true;btn.textContent='Analisando...';
  res.innerHTML='<div class="iload" style="padding:14px 0">Analisando todos os goals...</div>';
  try{
    var sum=D.map(function(g){return{owner:g.owner,team:g.team,goal:g.goal,status:g.current,updates:[1,2,3,4,5,6].map(function(n){return{w:n,s:gW(g,n).s,u:gW(g,n).u};}).filter(function(w){return w.s||w.u;})};});
    var t=await ai('PM Analysis do ciclo Q2-C1, semana '+CW+' de 6.\n\nProduza um briefing com estas 4 seções:\n\n**1. UPDATES NÃO ENVIADOS**\nQuem não atualizou na semana '+CW+'?\n\n**2. ITENS EM RISCO**\nGoals Yellow/Red, bloqueios, estagnação. Por quê cada um é preocupante (1-2 frases).\n\n**3. O QUE ESTÁ INDO BEM**\n3-5 goals com boa evolução.\n\n**4. ACTION ITEMS**\n3-5 ações concretas para essa semana.\n\nEm português, direto.\n\n'+JSON.stringify(sum),'analysis');
    res.innerHTML='<div class="tool-result">'+md(t)+'</div>';
  }catch(e){res.innerHTML='<p style="color:var(--red);padding-top:12px">Erro: '+e.message+'</p>';}
  btn.disabled=false;btn.textContent='Rodar análise ↗';
}

async function doMarcela(){
  var btn=document.getElementById('mbtn'),res=document.getElementById('mres');
  btn.disabled=true;btn.textContent='Analisando...';
  res.innerHTML='<div class="iload" style="padding:14px 0">Aplicando a lente da Marcela...</div>';
  try{
    var sum=D.map(function(g){return{owner:g.owner,team:g.team,goal:g.goal,status:g.current,priority:g.priority,updates:[1,2,3,4,5,6].map(function(n){return{w:n,s:gW(g,n).s,u:gW(g,n).u};}).filter(function(w){return w.s||w.u;})};});
    var t=await ai('Simule a perspectiva da Marcela, líder com forte olhar de PM e governança. Ela consistentemente:\n1. Pergunta "qual é o valor de negócio?"\n2. Identifica ownership indefinido\n3. Lê vagueza como risco\n4. Pergunta "o que acontece se atrasar?"\n5. Questiona dependências de terceiros\n6. Exige critério de done claro\n7. Pergunta "qual é a versão mais simples que já entrega valor?" — quer slices menores e releasable\n8. Propõe realocação proativamente\n\nAnalise o ciclo Q2-C1 e responda em português com estas seções:\n\n**🔍 PERGUNTAS QUE A MARCELA FARIA**\n[owner/goal] "Pergunta exata" — por que ela perguntaria\n\n**⚠️ SINAIS DE RISCO**\n4-6 riscos: outputs vagos, owners faltando, blockers, estagnação, sem critério de done\n\n**✂️ "QUAL É A VERSÃO MAIS SIMPLES?"**\n3-4 goals onde ela desafiaria o time. Como seria o MVP/slice?\n\n**👤 QUEM PRECISA DE UMA CONVERSA**\n2-3 pessoas que ela buscaria essa semana e por quê.\n\nDireto, no tom dela.\n\n'+JSON.stringify(sum),'marcela');
    res.innerHTML='<div class="tool-result">'+md(t)+'</div>';
  }catch(e){res.innerHTML='<p style="color:var(--red);padding-top:12px">Erro: '+e.message+'</p>';}
  btn.disabled=false;btn.textContent='Rodar Marcela Mode ↗';
}

function md(t){
  return t.split('\n').map(function(l){
    if(/^\*\*[^*]/.test(l)&&l.endsWith('**'))return '<h3>'+l.replace(/\*\*/g,'')+'</h3>';
    if(/^#{1,3}\s/.test(l))return '<h3>'+l.replace(/^#+\s/,'')+'</h3>';
    if(l.startsWith('- ')||l.startsWith('• '))return '<li>'+l.slice(2).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</li>';
    if(!l.trim())return '<br>';
    return '<p>'+l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</p>';
  }).join('');
}

// ── WEEK ───────────────────────────────────────────────────────────────
function setW(w){
  CW=parseInt(w);
  if(!D.length)return;
  document.getElementById('cyc').textContent='Q2-C1 · Semana '+CW+' de 6';
  resetTabs();updBadges();show('ov');
}

// ── RENDERERS ──────────────────────────────────────────────────────────
function rOv(){
  var ms=getMiss(),rk=getRisk(),gd=getGood();
  var h='<div class="stats">'+
    '<div class="stat"><div class="stat-l">Total goals</div><div class="stat-n">'+D.length+'</div></div>'+
    '<div class="stat"><div class="stat-l">On track</div><div class="stat-n cg">'+gd.length+'</div></div>'+
    '<div class="stat"><div class="stat-l">At risk</div><div class="stat-n cy">'+rk.length+'</div></div>'+
    '<div class="stat"><div class="stat-l">Sem update S'+CW+'</div><div class="stat-n cr">'+ms.length+'</div></div>'+
  '</div>';
  if(ms.length){
    h+='<div class="sect"><span class="sdot" style="background:var(--red)"></span>Sem update — semana '+CW+'</div>';
    ms.forEach(function(g){h+='<div class="mstrip"><span class="mown">'+g.owner+'</span><span class="mgoal">'+g.goal.slice(0,90)+'</span></div>';});
    h+='<div style="height:16px"></div>';
  }
  if(rk.length){
    h+='<div class="sect"><span class="sdot" style="background:#ef9f27"></span>At risk</div>';
    ownerGroups(rk).forEach(function(grp){h+=ownerBlock(grp);});
  }
  return h;
}

function rMs(){
  var ms=getMiss();
  var real=ms.filter(function(g){return gstate(g)==='missing';}).length;
  var ns=ms.filter(function(g){return gstate(g)==='notstarted';}).length;
  var nu=ms.filter(function(g){return gstate(g)==='neverupd';}).length;
  var h='<p style="font-size:12px;color:var(--text2);margin-bottom:14px">'+ms.length+' goals sem update <span style="color:var(--text3)">('+real+' sem S'+CW+' · '+ns+' not started · '+nu+' nunca atualizados)</span></p>';
  ownerGroups(ms).forEach(function(grp){h+=ownerBlock(grp);});
  return h;
}

function rRk(){
  var rk=getRisk();
  var h='<p style="font-size:12px;color:var(--text2);margin-bottom:14px">'+rk.length+' goals Yellow/Red/Abandoned</p>';
  ownerGroups(rk).forEach(function(grp){h+=ownerBlock(grp);});
  return h;
}

function rAl(){
  var h='';
  ownerGroups(D).forEach(function(grp){h+=ownerBlock(grp);});
  return h;
}

function rAn(){
  return '<div class="toolbox">'+
    '<p class="tool-intro">Briefing completo de PM — quem não atualizou, o que está em risco, o que está indo bem, e o que fazer essa semana.</p>'+
    '<button class="pbtn" id="abtn" onclick="doAnalysis()">Rodar análise ↗</button>'+
    '<div id="ares"></div>'+
  '</div>';
}

function rMc(){
  return '<div>'+
    '<div class="mbox">'+
      '<div class="mtitle">✦ Marcela Mode</div>'+
      '<div class="msub">Simula o olhar da Marcela — perguntas de PM e governança, versões mais simples, sinais de risco, quem precisa de uma conversa.</div>'+
      '<div class="mtags">'+
        '<span class="mtag">valor de negócio</span><span class="mtag">ownership claro</span><span class="mtag">vagueza = risco</span>'+
        '<span class="mtag">versão mais simples</span><span class="mtag">releasable?</span><span class="mtag">dependências externas</span><span class="mtag">realocação proativa</span>'+
      '</div>'+
    '</div>'+
    '<button class="mpbtn" id="mbtn" onclick="doMarcela()">Rodar Marcela Mode ↗</button>'+
    '<div id="mres"></div>'+
  '</div>';
}

// ── NAV ────────────────────────────────────────────────────────────────
var TABS=['ov','ms','rk','al','an','mc'];

function resetTabs(){
  TABS.forEach(function(t){var el=document.getElementById('t-'+t);el.dataset.r='';el.innerHTML='';});
}

function show(name){
  TABS.forEach(function(t){document.getElementById('t-'+t).style.display=t===name?'block':'none';});
  document.querySelectorAll('.ni').forEach(function(b){
    var txt=b.textContent.trim();
    var on=(name==='ov'&&txt.startsWith('Ov'))||(name==='ms'&&txt.startsWith('Sem'))||
           (name==='rk'&&txt.startsWith('At'))||(name==='al'&&txt.startsWith('To'))||
           (name==='an'&&txt.startsWith('AI'))||(name==='mc'&&txt.startsWith('Mar'));
    b.classList.toggle('on',on);
  });
  var el=document.getElementById('t-'+name);
  if(el.dataset.r)return;el.dataset.r='1';
  if(name==='ov')el.innerHTML=rOv();
  else if(name==='ms')el.innerHTML=rMs();
  else if(name==='rk')el.innerHTML=rRk();
  else if(name==='al')el.innerHTML=rAl();
  else if(name==='an')el.innerHTML=rAn();
  else if(name==='mc')el.innerHTML=rMc();
}

function updBadges(){
  document.getElementById('b-ov').textContent=getMiss().length;
  document.getElementById('b-ms').textContent=getMiss().length;
  document.getElementById('b-rk').textContent=getRisk().length;
  document.getElementById('b-al').textContent=D.length;
}
</script>
